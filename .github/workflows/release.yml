name: Release

# A tag (v1.0.0, v1.0.0-rc1 …) builds and tests every app, then puts them all in one GitHub release —
# a pre-release for -rc, -beta and -alpha tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  desktop:
    name: Desktop apps
    needs: tests
    uses: ./.github/workflows/desktop.yml

  android:
    name: Android app
    needs: tests
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    name: GitHub release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SpartaGen-*
          merge-multiple: true
          path: apps
      - run: ls -la apps
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            apps/*.zip
            apps/*.apk
