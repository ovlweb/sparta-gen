name: Desktop apps

# Windows, macOS (Apple silicon; Intel Macs are not supported) and Linux: the app with the engine inside, zipped.
# Each one is tested before it is kept: the engine's self-test (a test video through the one-click remix, saved as MP4
# and MP3 with the bundled ffmpeg), the engine started the way the app starts it, then the packaged app has to find
# and start its engine.  When the engine crashes, the log shows its threads' tracebacks and (macOS) the crash report.
# Built when the app or its packaging changes (macOS minutes cost the most), from the Actions tab, and for releases.
on:
  push:
    branches: ["**"]
    paths:
      - "app/lib/**"
      - "app/assets/**"
      - "app/linux/**"
      - "app/windows/**"
      - "app/macos/**"
      - "app/pubspec.*"
      - "spartagen/templates/**"
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "spartagen/selftest.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "A release's version (v1.0.0-rc2 …): the app is built as that version"
        type: string
        default: ""

# (Called by Release, github.workflow is "Release": a release's run is never cancelled by a push's, nor cancels it.)
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  app:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS (Apple silicon) }
          - { os: ubuntu-24.04, name: Linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release's version in the app
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/set_version.py "$VERSION"
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Engine build tools
        run: pip install pyinstaller numpy scipy pillow yt-dlp imageio-ffmpeg certifi
      - name: Build and test
        run: python scripts/build_desktop.py --test
      - uses: actions/upload-artifact@v4
        with:
          name: SpartaGen-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
