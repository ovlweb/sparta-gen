name: test & build

# One Sparta Gen for every device.  Every push runs the tests.  The apps — Windows, macOS (Apple silicon
# and Intel), Linux and Android — are built, and each one is tested before it is kept (the desktop apps run
# their self-test: a test video through the one-click remix with the bundled ffmpeg; the Android app runs
# on an emulator), for tags, from the Actions tab (Run workflow), and for pushes that change them.
# A tag (v*) puts all of them in one release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (with scipy)
        run: pytest -q
      - name: Tests (numpy only, like minimal Android installs)
        run: |
          pip uninstall -y scipy
          pytest -q

  plan:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=false
          if [ "$EVENT" = workflow_dispatch ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then all=true; fi
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$PR_BASE" "$GITHUB_SHA")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=$(git show --name-only --format= "$GITHUB_SHA")
          fi
          echo "changed files:"; echo "$changed"
          desktop=$all
          android=$all
          # (Desktop apps cost the most runner time — macOS minutes count tenfold — so edits to this workflow
          # alone do not rebuild them: tags and Run workflow do.)
          if echo "$changed" | grep -qE '^(packaging/|scripts/build_desktop\.py|spartagen/selftest\.py|spartagen/gui/launch\.py)'; then desktop=true; fi
          if echo "$changed" | grep -qE '^(android/|spartagen/|\.github/workflows/build\.yml)'; then android=true; fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "desktop apps: $desktop · Android app: $android"

  desktop:
    name: desktop app (${{ matrix.name }})
    needs: [test, plan]
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS Apple silicon }
          - { os: macos-15-intel, name: macOS Intel }
          - { os: ubuntu-22.04, name: Linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install pyinstaller numpy scipy pillow yt-dlp imageio-ffmpeg pywebview
      - name: Build and self-test
        run: python scripts/build_desktop.py --test
      - uses: actions/upload-artifact@v4
        with:
          name: SpartaGen-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error

  ffmpeg-android:
    name: ffmpeg for Android
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: ffmpeg-android-${{ hashFiles('android/ffmpeg/build.sh') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config
      - name: Build ffmpeg + x264 (arm64-v8a, x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          ABIS="arm64-v8a x86_64" bash android/ffmpeg/build.sh
      - name: Check that it runs on phones
        # (The emulator runs the x86_64 build; this checks the arm64 one too.)  Android runs position-independent
        # programs without text relocations that link only libraries every device has.
        run: |
          for so in android/app/src/main/jniLibs/*/libffmpeg.so; do
            echo "== $so ($(du -h "$so" | cut -f1))"
            readelf -h "$so" | grep -E "Type:|Machine:"
            readelf -d "$so" | grep -E "NEEDED|FLAGS" || true
            readelf -lW "$so" | awk '$1 == "LOAD" {print "  LOAD align", $NF}' | sort -u
            readelf -h "$so" | grep -q "DYN (" || { echo "::error::$so is not position-independent"; exit 1; }
            if readelf -d "$so" | grep -q TEXTREL; then echo "::error::$so has text relocations"; exit 1; fi
            extra=$(readelf -d "$so" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | grep -vxE 'lib(c|m|dl|z|log)\.so' || true)
            if [ -n "$extra" ]; then echo "::error::$so links libraries phones may not have: $extra"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
          if-no-files-found: error

  android:
    name: Android app (phones, arm64)
    needs: [test, ffmpeg-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # Chaquopy builds with the same Python version as the app's
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        env:
          # Optional: a key of your own (repository secrets); without it the repository's sideload key signs.
          KEYSTORE_B64: ${{ secrets.SPARTAGEN_KEYSTORE_B64 }}
          SPARTAGEN_KEYSTORE_PASSWORD: ${{ secrets.SPARTAGEN_KEYSTORE_PASSWORD }}
          SPARTAGEN_KEY_ALIAS: ${{ secrets.SPARTAGEN_KEY_ALIAS }}
          SPARTAGEN_KEY_PASSWORD: ${{ secrets.SPARTAGEN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SPARTAGEN_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease -Pabis=arm64-v8a
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ../spartagen/__init__.py)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SpartaGen-$version-Android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SpartaGen-Android-APK
          path: android/dist/*.apk
          if-no-files-found: error

  android-emulator:
    name: Android app on an emulator
    needs: [test, ffmpeg-android]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (x86_64)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug -Pabis=x86_64
      - name: Test source
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy
          python android/test/make_source.py "$RUNNER_TEMP/source.mp4"
      - name: Room for the emulator
        # The emulator needs ~1.25x its data partition free: drop toolchains this job does not use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            "$ANDROID_HOME/ndk" || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/test/smoke.sh android/app/build/outputs/apk/debug/app-debug.apk ${{ runner.temp }}/source.mp4 android-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test
          path: android-test
          if-no-files-found: ignore

  release:
    name: one release with every app
    needs: [desktop, android, android-emulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SpartaGen-*
          merge-multiple: true
          path: apps
      - run: ls -la apps
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/*.zip
            apps/*.apk
