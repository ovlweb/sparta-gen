name: android

# The Android app: ffmpeg built for phones, the APK, and the APK tested on an emulator (the engine
# starts, its ffmpeg runs, the one-click remix renders).  Tags attach the APK to the release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "spartagen/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  ffmpeg:
    name: ffmpeg for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: ffmpeg-android-${{ hashFiles('android/ffmpeg/build.sh') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config
      - name: Build ffmpeg + x264 (arm64-v8a, x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          ABIS="arm64-v8a x86_64" bash android/ffmpeg/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
          if-no-files-found: error

  apk:
    name: APK (phones, arm64)
    needs: ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # Chaquopy builds with the same Python version as the app's
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        env:
          # Optional: a key of your own (repository secrets); without it the repository's sideload key signs.
          KEYSTORE_B64: ${{ secrets.SPARTAGEN_KEYSTORE_B64 }}
          SPARTAGEN_KEYSTORE_PASSWORD: ${{ secrets.SPARTAGEN_KEYSTORE_PASSWORD }}
          SPARTAGEN_KEY_ALIAS: ${{ secrets.SPARTAGEN_KEY_ALIAS }}
          SPARTAGEN_KEY_PASSWORD: ${{ secrets.SPARTAGEN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SPARTAGEN_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease -Pabis=arm64-v8a
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ../spartagen/__init__.py)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SpartaGen-$version-android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SpartaGen-Android-APK
          path: android/dist/*.apk
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk

  emulator:
    name: APK on an emulator
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-android
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (x86_64)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug -Pabis=x86_64
      - name: Test source
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy
          python android/test/make_source.py "$RUNNER_TEMP/source.mp4"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/test/smoke.sh android/app/build/outputs/apk/debug/app-debug.apk ${{ runner.temp }}/source.mp4 android-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test
          path: android-test
          if-no-files-found: ignore
