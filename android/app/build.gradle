plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

// One version for the engine and the app: spartagen/__init__.py.
def engineVersion = (file("../../spartagen/__init__.py").text =~ /__version__ = "([^"]+)"/)[0][1]
def versionParts = engineVersion.tokenize(".").collect { (it =~ /^\d+/)[0] as int }
def abiList = (findProperty("abis") ?: "arm64-v8a").split(",").collect { it.trim() }.findAll { it }

// The app's Python code is the repository's own engine, copied fresh whenever Gradle runs.
def pythonSrc = new File(buildDir, "python-src")
project.delete(pythonSrc)
project.copy {
    from(file("../../spartagen")) {
        exclude "**/__pycache__/**", "**/*.pyc"
    }
    into new File(pythonSrc, "spartagen")
}

android {
    namespace "gen.sparta.remix"
    compileSdk 35

    defaultConfig {
        applicationId "gen.sparta.remix"
        minSdk 24
        targetSdk 35
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName engineVersion
        ndk {
            abiFilters(*abiList)
        }
    }

    signingConfigs {
        shared {
            // A key of your own from the environment (e.g. CI secrets); otherwise the repository's
            // sideload key, so every new APK installs over the one before (see README.md).
            def keystore = System.getenv("SPARTAGEN_KEYSTORE")
            storeFile keystore ? file(keystore) : file("../sideload.keystore")
            storePassword System.getenv("SPARTAGEN_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("SPARTAGEN_KEY_ALIAS") ?: "sparta-gen"
            keyPassword System.getenv("SPARTAGEN_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    packaging {
        // ffmpeg is a program: Android only runs it from the extracted native-library folder.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            install "numpy"
            install "yt-dlp"
        }
        // The web app's pages are files next to the code: keep the package on the filesystem.
        extractPackages "spartagen"
    }
    sourceSets {
        main {
            srcDir pythonSrc
        }
    }
}

// Each ABI needs its ffmpeg (bash ffmpeg/build.sh) — fail early instead of shipping an app without it.
tasks.named("preBuild") {
    doFirst {
        abiList.each { abi ->
            if (!file("src/main/jniLibs/$abi/libffmpeg.so").isFile()) {
                throw new GradleException("src/main/jniLibs/$abi/libffmpeg.so is missing: run ABIS=$abi bash ffmpeg/build.sh")
            }
        }
    }
}
